[project]
name = "ccplaytv"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "cryptography>=50.0.2",
    "fastapi>=0.141.1",
    "google-cloud-firestore>=2.34.1",
    "google-cloud-storage>=3.17.0",
    "httpx>=0.28.1",
    "m3u-ipytv>=1.0.0",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.15.0",
    "qrcode[pil]>=8.2",
    "sqlalchemy[asyncio]>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends"]

# Project type [web_app, test_runner]
project_type: web_app

# Default profile, Tizen API version
profile: tv-samsung
api_version: "10.0"

# Build type [Debug/ Release/ Test]
build_type: Debug

# Output name for application
output_name: CCPlayTv

# Output path for build
output_path: ""

# Enable size optimization of wgt for web workspace
opt: false

# Signing profile to be used for Tizen package signing
# If value is empty: "", active signing profile will be used
# Else If value is ".", default signing profile will be used
signing_profile: ""

# list of certs in web project (.trust-anchor)
trust_anchor: []

# list of files in web project (.html,.css etc) and resources
# Sincronizado de tv-web/dist via tv-web/scripts/sync-tizen.mjs. Nomes fixos
# (sem hash) no build do Vite (ver tv-web/vite.config.ts) — essa lista só
# precisa mudar se surgir um arquivo novo, não a cada build.
files:
  - index.html
  - favicon.svg
  - icons.svg
  - icon.png
  - assets/index.js
  - assets/index.css
  # Worker de importação (feature 005), alcançado a partir de
  # `importRunner.ts` — que `importApi.ts` chama. Enquanto nada no grafo do
  # app criasse esse Worker, o empacotador não emitia o arquivo e esta linha
  # apontava para um caminho inexistente. Ausência do arquivo NÃO falha no
  # navegador nem nos testes — só na TV. Ver R-002.
  - assets/importWorker.js
  # Worker de EPG (feature 030), alcançado a partir de `epgRunner.ts` — que
  # `importApi.ts` chama. Mesmo risco do Worker de importação: arquivo fora
  # desta lista só falha na TV (R-005 da 030); o guard `findUnlistedFiles`
  # do `sync-tizen.mjs` recusa sincronizar se ele sumir daqui.
  - assets/epgWorker.js
  # Fontes Poppins/Inter empacotadas localmente (feature 021, D-002) — sem
  # elas o app cai no fallback Arial/Helvetica em silêncio, só perceptível
  # na TV. `tv-web/scripts/sync-tizen.mjs` recusa sincronizar se alguma
  # sumir desta lista (D-009).
  - assets/poppins-latin-600-normal.woff2
  - assets/poppins-latin-700-normal.woff2
  - assets/poppins-latin-800-normal.woff2
  - assets/inter-latin-400-normal.woff2
  - assets/inter-latin-500-normal.woff2
  - assets/inter-latin-600-normal.woff2
  - assets/inter-latin-700-normal.woff2
  - assets/inter-latin-800-normal.woff2

# list of files to exclude based on the matched patterns
excludes:
  - Build/*
  - Debug/*
  - Directory.Build.targets
  - Release/*
  - Test/*
  - \.Build/.*
  - \.buildResult/.*
  - \.csproj
  - \.externalToolBuilders/.*
  - \.gn
  - \.obj/.*
  - \.package/.*
  - \.project
  - \.rds_delta
  - \.sdk_delta.info
  - \.settings/.*
  - \.sign/.*
  - \.tizen-ui-builder-tool.xml
  - \.tproject
  - \.wgt
  - tizen_web_project.yaml
  - webUnitTest/*

# project dependencies
deps: []


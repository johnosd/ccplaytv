main{display:grid;grid-template-columns:1fr 400px;min-height:0}
#wrap{position:relative;overflow:hidden}

.show-nd .nd{outline:2px dashed var(--info);outline-offset:3px}

 document.querySelectorAll('#ui .row-track').forEach(el=>{const k=el.dataset.key,c=f.c[k]||0,start=V==='C'?Math.max(0,c-1):c,cl=el.children[start];let x=cl?cl.offsetLeft:0;x=Math.min(x,Math.max(0,el.scrollWidth-el.clientWidth));slide(el,'x',V+k,-x)});
 const vt=$('#ui .vtrack');if(!vt)return;
 const rowEl=vt.querySelector(`[data-row="${f.r}"]`);let y=0;
 if(f.r>0&&rowEl)y=V==='C'?-(rowEl.offsetTop-130):-rowEl.offsetTop;
 slide(vt,'y',V+'v',y)}

let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),1800)}
function ok(R){const f=F(),row=R[f.r],it=row.items[f.c[row.key]||0];let m;
 if(row.kind==='hero')m=it.live?`▶ Tocaria ${it.e.name}`:{primary:'▶ Retomaria Horizonte Zero em T1:E3',details:'Abriria o detalhe de Horizonte Zero',mylist:'Tiraria Horizonte Zero da Minha Lista',trailer:'Abriria o trailer (TMDB)'}[it.a.id];
 else if(row.kind==='live')m=`▶ Tocaria ${it.e.name}`;
 else if(row.kind==='ai')m='Em breve — Curadoria por IA';
 else m=`Abriria o detalhe de ${it.e.name}`;
 toast(m)}

document.addEventListener('keydown',ev=>{
 const k=ev.key;
 if('123'.includes(k)&&k.length===1){setVariant('ABC'['123'.indexOf(k)]);return}
 if(k==='n'||k==='N'){toggleNd();return}
 const R=rowsOf(),f=F(),row=R[f.r],c=f.c[row.key]||0,len=row.items.length;
 if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Enter'].includes(k))return;
 ev.preventDefault();
 if(k==='Enter'){ok(R);return}
 // C: a coluna "Ao vivo agora" do hero é vertical (índices 4..6)
 if(V==='C'&&f.r===0&&c>=4){
  if(k==='ArrowUp'){if(c>4)f.c.hero=c-1}
  else if(k==='ArrowDown'){if(c<6)f.c.hero=c+1;else f.r=1}
  else if(k==='ArrowLeft')f.c.hero=3;
  render();return}
 if(k==='ArrowLeft')f.c[row.key]=Math.max(0,c-1);
 else if(k==='ArrowRight')f.c[row.key]=Math.min(len-1,c+1);
 else if(k==='ArrowUp')f.r=Math.max(0,f.r-1);
 else if(k==='ArrowDown')f.r=Math.min(R.length-1,f.r+1);
 render()});

/* ---------- painel lateral ---------- */
const INFO={

  risk:['O hero reativo redesenha a área grande a cada ←/→: precisa de debounce (~250 ms, como o prefetch R-013) e de trocar só imagem já decodificada.','Cards paisagem dependem de backdrop TMDB em cache; sem ele, cai no pôster com fundo desfocado.']},
 B:{t:'B · Vitrine expandida',ref:'Referência: Prime Video',
  what:['<b>Billboard cheio</b> só enquanto o foco está nele; ao descer ele recolhe e as fileiras ocupam a tela inteira, com o backdrop do item focado como <b>fundo ambiente</b> esmaecido.','<b>Pôster 250×375</b> (hoje 205 px) com <b>selos</b>: NOVO (added_at), ★ nota do provedor, ✓ assistido, ♥ Minha Lista.','<b>Card expandido no foco</b>: o pôster vira um card 16:9 de 667×375 com backdrop, meta, 2 linhas de sinopse e "OK Detalhes" — informação sem sair da Home.','Continuar 480×270 cresce para 600×338 no foco.','Top 10 com numeral gigante; o card focado também expande.'],
  risk:['O <code>Rail</code> virtualizado usa <code>itemWidth</code> fixo; largura variável no foco exige mudar o cálculo de posição.','Animar largura é caro na TV: preferir trocar o conteúdo e animar só <code>transform</code>/<code>opacity</code>.']},
 C:{t:'C · Hub IPTV',ref:'Referência: Netflix + guia de TV',
  what:['<b>Hero dividido</b>: destaque à esquerda e uma coluna <b>"Ao vivo agora"</b> com 3 canais favoritos, programa atual e barra do EPG — a TV ao vivo, ponto forte do app, já aparece na abertura.','A página rola como documento (fileiras anteriores continuam visíveis) e o <b>fundo ambiente</b> muda com o item focado.','<b>Faixa de informação</b> sob o card focado (título · ano · duração · gêneros · nota · sinopse em 1 linha), no estilo Apple TV.','Tamanhos por tipo: Continuar 440×248 com progresso, pôster 230×345 com selos, Top 10 grande.','"Porque você assistiu" mostra a capa do título de origem no cabeçalho.'],
  risk:['Navegação 2D no topo (ações → coluna vertical de canais) precisa de regra explícita no useRemoteNav.','O hero não reage ao foco (só o fundo); é a variação mais leve para a TV.']},
};
function side(){const i=INFO[V];$('#side').innerHTML=`<h2>${i.t}</h2><div class="ref">${i.ref}</div>
 <h3>O que muda</h3><ul>${i.what.map(x=>`<li>${x}</li>`).join('')}</ul>
 <h3>Riscos / custo</h3><ul>${i.risk.map(x=>`<li>${x}</li>`).join('')}</ul>
 <h3>Comum às três</h3><ul>
  <li>Fileiras novas: <b>Ao vivo agora</b> (favoritos + EPG), <b>Porque você assistiu</b> (Semelhantes TMDB do último título concluído, só os que estão na lista) e <b>Adicionados recentemente</b> (added_at da fonte).</li>
  <li>Backdrop e sinopse na Home vêm da metadata TMDB <b>já em cache</b> no aparelho (a mesma do detalhe). Focar nunca dispara consulta nem vídeo — sem cache, o card mostra pôster e nome.</li>
  <li>Curadoria IA continua <b>"Em breve"</b> (soft-disabled), nunca conteúdo inventado. Nada de "98% relevante".</li>
  <li>O Trailer do hero passa a ser real (reaproveita a feature 033 do detalhe).</li>
 </ul>
 <h3>Dados</h3><ul>
  <li>Tudo já existe no app, <b>exceto</b> o que aparece com <span class="nd-sample">contorno tracejado</span>: classificação indicativa e nota TMDB (seriam dados novos do TMDB). Tecla <span class="kbd">N</span> liga/desliga.</li>
 </ul>
 <h3>Tamanhos (hoje → aqui)</h3><table>
  <tr><td>Continuar</td><td>205 retrato → ${V==='A'?'400×225':V==='B'?'480×270 (600 no foco)':'440×248'}</td></tr>
  <tr><td>Pôster</td><td>205 → ${V==='A'?'400×225 paisagem':V==='B'?'250×375 (667×375 no foco)':'230×345'}</td></tr>
  <tr><td>Top 10</td><td>226×333 → ${V==='B'?'250×375':'230×345'} + numeral 290 px</td></tr>
  <tr><td>Canal</td><td>340×100 → ${V==='A'?'400×225':V==='B'?'480×270':'tile 472×118 no hero'}</td></tr>
 </table>
 <h3>Controles</h3><ul><li><span class="kbd">← ↑ → ↓</span> foco · <span class="kbd">Enter</span> OK · <span class="kbd">1</span><span class="kbd">2</span><span class="kbd">3</span> variação</li></ul>`}

function setVariant(v){V=v;bgId=null;$('#bg').innerHTML='';lastHeroKey='';document.querySelectorAll('.top button[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===v));side();render()}
function toggleNd(){const on=document.body.classList.toggle('show-nd');$('#ndBtn').classList.toggle('on',on)}
document.querySelectorAll('.top button[data-v]').forEach(b=>b.onclick=()=>{setVariant(b.dataset.v);b.blur()});
$('#ndBtn').onclick=e=>{toggleNd();e.currentTarget.blur()};
function fit(){const w=$('#wrap'),s=Math.min(w.clientWidth/1920,w.clientHeight/1080),st=$('#stage');st.style.transform=`scale(${s})`;st.style.left=(w.clientWidth-1920*s)/2+'px';st.style.top=(w.clientHeight-1080*s)/2+'px'}
addEventListener('resize',fit);
fit();setVariant('A');
</script>
